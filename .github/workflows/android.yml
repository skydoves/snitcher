name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Spotless check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: spotless
        run: ./gradlew spotlessCheck

  build:
    name: Build and check
    # the apple targets can only be compiled on a mac.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          ./gradlew --scan --stacktrace \
              assemble -x :benchmark:pixel6api31Setup -x :benchmark:pixel6api31NonMinifiedReleaseAndroidTest -x :benchmark:collectNonMinifiedReleaseBaselineProfile

      - name: Check with Gradle
        # covers the ABI dumps, the common and iOS tests, and the android lint.
        run: ./gradlew :snitcher:checkKotlinAbi :snitcher:desktopTest :snitcher:iosSimulatorArm64Test
